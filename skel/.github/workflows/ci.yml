name: ci

# "Does it parse, does it pass, and is it free of personal data" on every push
# and PR, on this project's own runner on the house's CI box: a self-hosted
# runner labelled only `{{PROJECT}}-ci` (docs/ci-runner.md — no `self-hosted`
# label, so it is never handed a deploy). Nothing here needs a secret or
# touches a real device. Never GitHub's cloud runners (the owner's rule,
# 2026-10-24: the house's code and data are checked on house compute only).
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A release fast-forwards main to a dev commit CI has already passed: the
  # same checks on the same code tell nothing new. A push to main asks
  # whether this exact commit already has a green run, and if so the jobs
  # below are skipped and the run still ends green — which is what a deploy
  # triggered by this workflow waits for. Anything else gets the full run: a
  # push to another branch, a PR, a commit not yet green (a merge or squash
  # makes one), or the API not answering. (homecast, 2026-10-10.)
  seen:
    runs-on: ["{{PROJECT}}-ci"]
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      green: ${{ steps.ask.outputs.green }}
    steps:
      - id: ask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          green=false
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            n=$(curl -fsS -m 20 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                  "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=success&per_page=1" \
                | python3 -c "import json,sys; print(json.load(sys.stdin).get('total_count', 0))" 2>/dev/null || echo 0)
            [ "${n:-0}" -gt 0 ] && green=true
          fi
          echo "green=$green" >> "$GITHUB_OUTPUT"
          echo "this commit already passed CI: $green"

  hygiene:
    needs: seen
    if: needs.seen.outputs.green != 'true'
    runs-on: ["{{PROJECT}}-ci"]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: no personal data in tracked files
        run: scripts/pii-scan.sh

      - name: shell scripts parse and are shellcheck-clean
        run: |
          set -euo pipefail
          # --others so a script that has not been `git add`ed yet is still
          # checked. Plain `git ls-files` lists only TRACKED files, which is
          # EMPTY in a repo with no commits — so a brand-new project scaffolded
          # from this template linted nothing and went green, at exactly the
          # moment a first commit is most likely to carry a mistake. This is
          # the same lesson scripts/pii-scan.sh already carries.
          mapfile -t sh < <(git ls-files --cached --others --exclude-standard '*.sh' .githooks)
          # An empty list is a FAILURE, not a skip: a linter that reports
          # success having examined nothing is worse than no linter.
          if [ ${#sh[@]} -eq 0 ]; then
            echo "found no shell scripts to check — the file list is broken" >&2
            exit 1
          fi
          bash -n "${sh[@]}"
          shellcheck "${sh[@]}"

  check:
    needs: seen
    if: needs.seen.outputs.green != 'true'
    runs-on: ["{{PROJECT}}-ci"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

