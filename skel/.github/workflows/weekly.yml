name: weekly

# Known vulnerabilities in this project's lockfiles (scripts/check.sh vuln),
# once a week and on demand. Weekly, not on every push: a new advisory arrives
# without any commit, and the database download would slow every push. It runs
# on this project's own CI runner; trivy's database comes from its public
# mirror, and the scan itself has no network, so nothing about the code
# leaves the house.
#
# GitHub runs schedule:, and offers "Run workflow", only for a workflow on the
# repo's default branch: where that is main, this starts working at the
# release that carries it, and until then the same command runs by hand.
#
# Pins: see ci.yml.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC, off the hour when everyone's cron fires
  workflow_dispatch:

permissions: {}

concurrency:
  group: weekly
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  vuln:
    runs-on: ["{{PROJECT}}-ci"]
    timeout-minutes: 30
    permissions:
      contents: read    # check out this private repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # TODO({{PROJECT}}): scan the images it ships too, as hallpass does:
      # build them under a project name of their own, so a running stack on
      # this box is never touched, always pulling the current base image, and
      # name them (plus any image used as is, e.g. postgres) in CHECK_IMAGES.
      #
      # - name: build the images, on a fresh base
      #   env:
      #     COMPOSE_PROJECT_NAME: {{PROJECT}}-weekly
      #   run: docker compose build --pull
      - name: known vulnerabilities
        # env:
        #   CHECK_IMAGES: "{{PROJECT}}-weekly-api {{PROJECT}}-weekly-web postgres:17-alpine"
        run: scripts/check.sh vuln

  # TODO({{PROJECT}}): the owner's choice: a restore drill, if this project
  # keeps backups. A backup nobody has restored is a hope, not a backup. A
  # monthly job (its own schedule) that restores the newest backup set from
  # the share into a scratch database and checks row counts and integrity
  # against the set's own manifest, then throws the scratch copy away. The
  # owner wires the share's path into the runner's environment on the box;
  # it never appears in a tracked file. Delete this comment if there are no
  # backups.
